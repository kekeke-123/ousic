name: Build ousic

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download source
        run: |
          URL=$(cat source-url.txt)
          curl -sSL --max-time 120 -o /tmp/src.tar.gz "$URL"
          mkdir -p src && tar -xzf /tmp/src.tar.gz -C src
          cd src
          test -f ousic.xcodeproj/project.pbxproj
          ls -la

      - name: Generate assets and charts
        working-directory: src
        run: |
          python3 tools/make_icon.py
          python3 tools/make_charts.py
          ls ousic/Resources/Charts | wc -l

      - name: Build (unsigned)
        working-directory: src
        run: |
          set -o pipefail
          xcodebuild \
            -project ousic.xcodeproj \
            -scheme ousic \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            build 2>&1 | tee build.log

      - name: Package IPA
        working-directory: src
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/ousic.app"
          test -d "$APP_PATH"
          rm -rf Payload ousic-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qr ousic-unsigned.ipa Payload
          ls -lh ousic-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ousic-unsigned-ipa
          path: src/ousic-unsigned.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: src/build.log
          if-no-files-found: ignore

      - name: Publish release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" src/ousic-unsigned.ipa \
            --title "ousic $TAG" \
            --notes "未签名 iOS 构建产物（arm64，iOS 15+），请用全能签等工具自行签名。" || true

      - name: Commit source into repository
        if: success()
        run: |
          git config user.name "ousic-bot"
          git config user.email "bot@ousic.local"
          rm -rf ousic ousic.xcodeproj tools README.md .gitignore
          cp -R src/. .
          rm -rf src Payload
          git add -A
          git commit -m "chore: ousic source [skip ci]" || echo "nothing to commit"
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main
          echo pushed
