name: Bootstrap and build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ousic
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download source package
        run: |
          set +e
          mkdir -p ci-log
          curl -sSL --max-time 60 -o /tmp/src.tar.gz -w "http=%{http_code} size=%{size_download}\n" "https://aka.doubaocdn.com/s/rScv5XryrD" > ci-log/curl.txt 2>&1
          echo "curl_exit=$?" >> ci-log/curl.txt
          file /tmp/src.tar.gz >> ci-log/curl.txt 2>&1
          ls -l /tmp/src.tar.gz >> ci-log/curl.txt 2>&1

      - name: Commit download diagnostics
        run: |
          git config user.name "ousic-bot"
          git config user.email "bot@ousic.local"
          git add ci-log
          git commit -m "ci: download diagnostics [skip ci]" || echo "nothing"
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main

      - name: Unpack source
        run: |
          tar -xzf /tmp/src.tar.gz -C .
          test -f ousic.xcodeproj/project.pbxproj
          ls -la

      - name: Commit unpacked source
        run: |
          git config user.name "ousic-bot"
          git config user.email "bot@ousic.local"
          git add -A
          git commit -m "chore: ousic source [skip ci]" || echo "nothing"
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main

      - name: Generate assets and charts
        run: |
          python3 tools/make_icon.py
          python3 tools/make_charts.py
          ls ousic/Resources/Charts | wc -l

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project ousic.xcodeproj \
            -scheme ousic \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            build 2>&1 | tee ci-log/build.log

      - name: Package IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/ousic.app"
          test -d "$APP_PATH"
          rm -rf Payload ousic-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qr ousic-unsigned.ipa Payload
          ls -lh ousic-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ousic-unsigned-ipa
          path: ousic-unsigned.ipa

      - name: Commit build log on failure
        if: failure()
        run: |
          git config user.name "ousic-bot"
          git config user.email "bot@ousic.local"
          git add -f ci-log
          git commit -m "ci: build log [skip ci]" || echo "nothing"
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-${{ github.run_number }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" ousic-unsigned.ipa --clobber
          else
            gh release create "$TAG" ousic-unsigned.ipa \
              --title "ousic build ${{ github.run_number }}" \
              --notes "未签名 iOS 构建产物（arm64），请用全能签等工具自行签名。"
          fi
